# Applying this Blueprint creates PAID services. Review the Render summary first.
services:
  - type: web
    name: hochstapler-burger
    runtime: node
    repo: https://github.com/Hochstapler0416/hochstapler-burger
    branch: render-wiederherstellung
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm run build:render
    preDeployCommand: pnpm run db:migrate
    startCommand: pnpm start
    healthCheckPath: /api/readyz
    autoDeployTrigger: off
    disk:
      name: hochstapler-fotos
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: DATABASE_URL
        fromDatabase:
          name: hochstapler-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: hochstapler-db
    region: frankfurt
    plan: 0.1c-256mb
    diskSizeGB: 1
    postgresMajorVersion: "17"
    ipAllowList: []

